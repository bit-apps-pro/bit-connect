# The public proof of the claim in readme.txt: that anyone can clone this
# repository and build the plugin. It runs the same commands a WordPress.org
# reviewer would, so the claim cannot rot unnoticed.

name: build

on:
  push:
    branches: [main]
    # A version tag runs the same build, then the `release` job below turns
    # its zip into a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # `--no-dev`, as `scripts/build-plugin.mjs` installs for the release zip.
      # The plugin itself runs on PHP 8.2; the dev toolchain (phpinsights,
      # symfony 8) needs 8.3+, and nothing after this step uses it.
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm ts-check

      - name: Build the plugin
        run: pnpm build:free

      - name: Assert the build produced the shipped assets
        run: |
          test -n "$(find assets -maxdepth 1 -name 'main*.js' -print -quit)"
          test -d assets/client

      - name: Assert the tree carries free code only
        run: node scripts/public-repo/assert-no-pro.mjs --tree .

      # Deliberately not `composer analyze`: PHPStan has pre-existing findings
      # tracked upstream, and a workflow that is red for reasons unrelated to
      # the build teaches everyone to ignore it. The promise this job keeps is
      # that the plugin builds from source — keep it answering exactly that.
      - name: Tests
        run: pnpm test

      # The same staging `pnpm prod:free-zip` does locally, minus the frontend
      # build (`--nobuild`) this job has already run and asserted. The script
      # ends by reinstalling dev Composer deps to restore the working tree;
      # COMPOSER_NO_DEV keeps that on the runtime set, which is all PHP 8.2
      # can install (see "Install PHP dependencies" above) and all a zip needs.
      - name: Zip the plugin
        env:
          COMPOSER_NO_DEV: '1'
        run: |
          node scripts/build-plugin.mjs --slug bit-connect --outdir build --nobuild --noi18n
          node scripts/prune-build.mjs --slug bit-connect --outdir build
          (cd build && zip -rq bit-connect.zip bit-connect)
          node scripts/rename-build-zip.mjs --slug bit-connect --outdir build

      # Downloadable from the run's "Artifacts" section for 14 days — enough
      # to install a build of any PR or main commit without a local toolchain.
      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: bit-connect-zip
          path: build/bit-connect-*.zip
          if-no-files-found: error
          retention-days: 14

  # Only on a `v<version>` tag: publish the zip the build job just proved as a
  # GitHub Release, so a release is always the artefact of a green build and
  # never a hand-made zip. Kept as its own job so the build's token stays
  # read-only and write access exists only here, only on tags.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bit-connect-zip

      # The zip carries the version from bit-connect.php's `Version:` header.
      # A tag that disagrees with it would publish a release whose name lies
      # about its contents — refuse rather than guess which one is right.
      - name: Assert the tag matches the plugin version
        run: |
          expected="bit-connect-${GITHUB_REF_NAME#v}.zip"
          test -f "$expected" || {
            echo "::error::tag $GITHUB_REF_NAME expects $expected, but the build produced: $(ls bit-connect-*.zip)"
            echo "Bump the Version: header (pnpm update-ver) and re-tag."
            exit 1
          }

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bit-connect-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
